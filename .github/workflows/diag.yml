name: Diagnóstico de permissões

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Permissões efetivas do token
        run: |
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/permissions/workflow || true
          echo
          echo "--- criar Pages site ---"
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"source":{"branch":"main","path":"/"}}' \
            https://api.github.com/repos/${{ github.repository }}/pages || true
